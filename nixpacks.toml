providers = ["php"]

[phases.setup]
nixPkgs = [
  "nginx",
  "php82",
  "php-fpm",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.intl",
  "php82Extensions.simplexml",
  "php82Extensions.dom",
  "php82Extensions.fileinfo",
  "php82Extensions.xml",
  "php82Extensions.session",
  "php82Extensions.curl"
]

[phases.install]
cmds = [
  "composer install --no-interaction --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
  "mkdir -p tmp/cache tmp/sessions tmp/logs",
  "chmod -R 777 tmp",
  "echo 'date.timezone = UTC' > .nixpacks/php.ini",
  "echo 'memory_limit = 256M' >> .nixpacks/php.ini",
  "echo 'upload_max_filesize = 20M' >> .nixpacks/php.ini",
  "echo 'post_max_size = 20M' >> .nixpacks/php.ini"
]

[start]
cmd = "php-fpm -c $PWD/.nixpacks/php.ini & nginx -c $PWD/.nixpacks/nginx.conf -g 'daemon off;'"
